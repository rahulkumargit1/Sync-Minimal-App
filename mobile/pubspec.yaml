name: sync_app
description: Sync - A high-performance, minimalist music streaming mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  cached_network_image: ^3.3.1
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  audio_session: ^0.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
