name: sync_app
description: Sync — Minimal Music Streaming App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_service: ^0.18.13
  audio_session: ^0.1.18
  http: ^1.2.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
